name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations, build, unit/integration & browser tests
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/portfolio_verification
      APP_ENV: development
      AUTH_SECRET: ci-test-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      RUN_DB_TESTS: "1"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Verify migration/schema agreement
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Unit test coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          NODE_ENV: production

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
